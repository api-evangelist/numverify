aid: numverify
name: Numverify API
description: >-
  Numverify is a free and simple REST API for national and international phone
  number validation and lookup across 232 countries, operated by APILayer (an
  Idera, Inc. brand). A single validate call returns whether a number is valid
  along with its local and international formats, country code and name,
  approximate location, carrier, and line type (mobile or landline).
  Authentication is by API key with two published bases — the legacy
  apilayer.net host (access_key query parameter) and the newer api.apilayer.com
  marketplace host (apikey header) — and access is metered by monthly request
  quota across free and paid plans.
